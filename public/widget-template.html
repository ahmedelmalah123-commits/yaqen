<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ودجت يقين للقرآن الكريم</title>
  <style>
    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Cairo", sans-serif;
      background: #111815;
      color: #E8D5B5;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100vh;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo {
      width: 44px;
      height: 44px;
      border-radius: 12px;
    }
    .title {
      font-size: 16px;
      font-weight: bold;
      color: #FFFFFF;
    }
    .sub {
      font-size: 12px;
      color: #A3A3A3;
    }
    .btn {
      display: block;
      text-align: center;
      padding: 10px 16px;
      border-radius: 12px;
      background: #10B981;
      color: #000000;
      font-weight: bold;
      text-decoration: none;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="/audio-artwork-96.png" alt="يقين" class="logo" />
    <div>
      <div class="title">يقين — القرآن الكريم</div>
      <div class="sub">متابعة الاستماع والتلاوة</div>
    </div>
  </div>
  <a href="/" class="btn" target="_blank">فتح مشغل يقين</a>
</body>
</html>
